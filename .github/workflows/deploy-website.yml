name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "assets/brand/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Prepare website image assets
        run: |
          cp assets/brand/yujie-logo-512.png website/public/yujie-logo.png
          cp assets/brand/yujie-logo.ico website/public/favicon.ico
          cp assets/brand/yujie-logo-512.png website/public/og.png

      - name: Build static website
        working-directory: website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Verify static export
        working-directory: website
        run: pnpm test:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
