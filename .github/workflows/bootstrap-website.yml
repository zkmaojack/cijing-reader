          WEBSITE_ARCHIVE
          tar -xJf website-bootstrap.tar.xz
          rm website-bootstrap.tar.xz
          rm .github/workflows/bootstrap-website.yml

      - name: Commit website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add product website and GitHub Pages deployment"
          git push origin HEAD:main

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Prepare website image assets
        run: |
          cp assets/brand/yujie-logo-512.png website/public/yujie-logo.png
          cp assets/brand/yujie-logo.ico website/public/favicon.ico
          cp assets/brand/yujie-logo-512.png website/public/og.png

      - name: Build static website
        working-directory: website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Verify static export
        working-directory: website
        run: pnpm test:static

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist/client
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
