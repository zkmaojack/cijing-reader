name: Bootstrap product website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-website.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

